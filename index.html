

<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miracle Analytics Dashboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          maxWidth: {
            container: "1280px",
          },
          animation: {
            marquee: 'marquee var(--duration) linear infinite',
            'fade-in': 'fadeIn 0.5s ease-out',
            'slide-up': 'slideUp 0.5s ease-out',
          },
          keyframes: {
            marquee: {
              from: { transform: 'translateX(0)' },
              to: { transform: 'translateX(calc(-100% - var(--gap)))' }
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
          }
        },
      },
    }
  </script>
<style>
  .insight-positive {
    color: #4ade80; /* Tailwind green-400 */
    font-weight: 600;
  }
  .insight-negative {
    color: #f87171; /* Tailwind red-400 */
    font-weight: 600;
  }
  /* Improve visibility of the date picker icon */
  input[type="date"]::-webkit-calendar-picker-indicator {
    cursor: pointer;
    filter: invert(0.3);
  }
  .dark input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.8);
  }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@18.3.1",
    "react-dom": "https://aistudiocdn.com/react-dom@18.3.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@18.3.1/",
    "react/": "https://aistudiocdn.com/react@18.3.1/",
    "recharts": "https://aistudiocdn.com/recharts@2.10.0",
    "xlsx": "https://aistudiocdn.com/xlsx@^0.18.5",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "firebase/": "https://aistudiocdn.com/firebase@^12.5.0/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@10.16.16",
    "clsx": "https://aistudiocdn.com/clsx@^2.1.0",
    "tailwind-merge": "https://aistudiocdn.com/tailwind-merge@^2.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.344.0",
    "@radix-ui/react-slot": "https://aistudiocdn.com/@radix-ui/react-slot@1.0.2",
    "@radix-ui/react-avatar": "https://aistudiocdn.com/@radix-ui/react-avatar@1.0.4",
    "class-variance-authority": "https://aistudiocdn.com/class-variance-authority@0.7.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</html>
